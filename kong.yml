_format_version: "3.0"
_transform: true

###
# Kong Declarative Configuration for Local Supabase
#
# This configuration routes requests to backend services:
# - /auth/v1/* -> GoTrue (authentication)
# - /rest/v1/* -> PostgREST (REST API)
###

services:
  # GoTrue (Auth) Service
  - name: auth-v1
    url: http://localhost:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
          exposed_headers:
            - X-Total-Count
          credentials: true
          max_age: 3600

  # PostgREST (REST API) Service
  - name: rest-v1
    url: http://localhost:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - Prefer
            - Range
            - x-client-info
          exposed_headers:
            - Content-Range
            - X-Total-Count
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_body: false
          hide_credentials: false

